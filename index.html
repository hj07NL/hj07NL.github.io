<!DOCTYPE html> <!--dit is de homepage van mijn site-->
<html> <!--dit is het html-element, hier staat de hele pagina in-->
    <head> <!--de head: informatie OVER de pagina, die zie je niet op de pagina-->
        <title>Ik ben Hai-Jun</title> <!--de titel, die staat op het tabblad-->
        <meta charset="utf-8"> <!--zorgt dat letters als ë en é goed worden getoond-->
        <link rel="stylesheet" type="text/css" href="opmaak.css"> <!--link naar mijn CSS-bestand. Zonder deze regel: geen opmaak!-->
    </head>
    <body> <!--de body: alles wat je ZIET op je site-->

        <!--MENU: een lijst van links. ul = de hele lijst, li = 1 regel van de lijst, a = de link-->
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="binairstelsel.html">Binair stelsel</a></li>
            <li><a href="kleurmodellen.html">Kleurmodellen</a></li>
        </ul>

        <!--div = een block-element: een doos voor de inhoud van mijn pagina.
            class="inhoud" = het naamkaartje van de doos, dat gebruik ik straks in CSS-->
        <div class="inhoud">

            <!--p = paragraaf, een block-element: begint altijd op een nieuwe regel-->
            <p>Hoi, ik ben Hai-Jun. Welkom op mijn website!</p>

            <!--a = link, een inline-element: neemt alleen de ruimte die nodig is.
                De link staat IN een p, want een block mag een inline-element bevatten-->
            <p><a href="binairstelsel.html">Uitleg binair stelsel</a></p>

            <!--img = plaatje, ook een inline-element-->
            <img src="Ict1.jpeg" alt="Een computerchip met blauw licht">

        </div> <!--einde van de doos-->

    </body>
</html>
